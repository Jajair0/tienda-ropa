<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - Urban Style</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>

<body>

    <header>

        <h1>Urban Style</h1>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="carrito.html">
                Carrito
            </a>

            <a href="pedidos.html">
                Mis pedidos
            </a>

            <a href="login.html">
                Iniciar sesión
            </a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icono">
                👤
            </div>

            <h2>
                Bienvenido de nuevo
            </h2>

            <p class="auth-subtitulo">
                Ingresa a tu cuenta de Urban Style
            </p>


            <form id="form-login">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >


                <button type="submit">
                    Iniciar sesión
                </button>

            </form>


            <p id="mensaje-login"></p>


            <div class="auth-separador">
                <span>
                    ¿No tienes una cuenta?
                </span>
            </div>


            <a
                href="registro.html"
                class="auth-link"
            >
                Crear una cuenta
            </a>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Urban Style
        </p>

        <p>
            Tu estilo, tu esencia.
        </p>

    </footer>


    <script src="js/login.js"></script>

</body>

</html>
