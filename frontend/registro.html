<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta - Melody's</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>

<body>

    <header>

        <h1>Melody's</h1>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="carrito.html">
                Carrito
            </a>

            <a href="pedidos.html">
                Mis pedidos
            </a>

            <a href="login.html">
                Iniciar sesión
            </a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icono">
                ✨
            </div>

            <h2>
                Crear una cuenta
            </h2>

            <p class="auth-subtitulo">
                Regístrate para comenzar a comprar
            </p>


            <form id="form-registro">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Tu nombre"
                    required
                >


                <label for="apellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="apellido"
                    placeholder="Tu apellido"
                    required
                >


                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Crea una contraseña"
                    required
                >


                <button type="submit">
                    Crear cuenta
                </button>

            </form>


            <p id="mensaje-registro"></p>


            <div class="auth-separador">
                <span>
                    ¿Ya tienes una cuenta?
                </span>
            </div>


            <a
                href="login.html"
                class="auth-link"
            >
                Iniciar sesión
            </a>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Melody's
        </p>

        <p>
            Tu estilo, tu esencia.
        </p>

    </footer>


    <script src="js/registro.js"></script>

</body>

</html>
