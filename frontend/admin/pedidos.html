
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar pedidos - Urban Style</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Urban Style | Admin</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="productos.html">Productos</a>
            <a href="../index.html">Tienda</a>
            <button class="btn-cerrar-sesion" onclick="cerrarSesionAdmin()">
                Cerrar sesión
            </button>
        </nav>
    </header>

    <main class="admin-container">
        <section class="admin-titulo">
            <div>
                <p class="admin-etiqueta">PANEL DE ADMINISTRACIÓN</p>
                <h2>Gestionar pedidos</h2>
                <p>Consulta las compras realizadas en Urban Style.</p>
            </div>
        </section>

        <section class="admin-menu">
            <div class="admin-titulo">
                <h2>Pedidos registrados</h2>
            </div>

            <div class="admin-tabla-contenedor">
    <table class="admin-tabla admin-tabla-pedidos">
        <thead>
            <tr>
                <th class="pedido-id">ID</th>
                <th class="pedido-cliente">Cliente</th>
                <th class="pedido-fecha">Fecha</th>
                <th class="pedido-total">Total</th>
                <th class="pedido-estado">Estado</th>
            </tr>
        </thead>
        <tbody id="tabla-pedidos">
            <tr>
                <td colspan="5">Cargando pedidos...</td>
            </tr>
        </tbody>
    </table>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Urban Style</p>
        <p>Panel de Administración</p>
    </footer>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));

        if (!usuario || usuario.rol !== 'ADMIN') {
            alert('No tienes permisos para acceder a esta página.');
            window.location.href = '../index.html';
        }

        function cerrarSesionAdmin() {
            localStorage.removeItem('usuario');
            window.location.href = '../index.html';
        }

        async function cargarPedidos() {
            const tabla = document.getElementById('tabla-pedidos');

            try {
                const respuesta = await fetch(
                    'http://localhost:3000/api/admin/pedidos'
                );

                const pedidos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        pedidos.mensaje || 'Error al cargar los pedidos.'
                    );
                }

                if (!Array.isArray(pedidos) || pedidos.length === 0) {
                    tabla.innerHTML = `
                        <tr>
                            <td colspan="5">No hay pedidos registrados.</td>
                        </tr>
                    `;
                    return;
                }

                tabla.innerHTML = '';

                pedidos.forEach(pedido => {
                    const fila = document.createElement('tr');

                    const fecha = pedido.fecha
                        ? new Date(pedido.fecha).toLocaleString('es-PE')
                        : '-';

                    fila.innerHTML = `
                        <td>${pedido.id_pedido}</td>
                        <td>${pedido.cliente || 'Cliente'}</td>
                        <td>${fecha}</td>
                        <td>S/ ${Number(pedido.total).toFixed(2)}</td>
                        <td>${pedido.estado || 'Pendiente'}</td>
                    `;

                    tabla.appendChild(fila);
                });

            } catch (error) {
                console.error('Error al cargar pedidos:', error);

                tabla.innerHTML = `
                    <tr>
                        <td colspan="5">
                            No se pudieron cargar los pedidos.
                            Revisa el backend.
                        </td>
                    </tr>
                `;
            }
        }

        cargarPedidos();
    </script>

</body>
</html>
